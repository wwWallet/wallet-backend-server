repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Minor auto-fixes
        exclude: (^|/)(node_modules|dist|build|coverage|\.nyc_output|test-results|playwright-report)/|(^|/)\.DS_Store$|^public/

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        name: Check .editorconfig rules
        args: ['-no-color']
        types_or: [text]

  - repo: local
    hooks:
      - id: prettier
        name: Check Prettier formatting
        entry: yarn format:check
        language: system
        pass_filenames: false

      - id: eslint
        name: Check ESLint rules
        entry: yarn lint
        language: system
        pass_filenames: false

      - id: typecheck
        name: Check TypeScript types
        entry: yarn typecheck
        language: system
        pass_filenames: false
