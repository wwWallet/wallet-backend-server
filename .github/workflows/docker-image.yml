name: Build Docker image

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every master run finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Permissions for GITHUB_TOKEN
    permissions:
      contents: read # To check out repo
      packages: read # To read NPM registry

    uses: wwwallet/wwwallet/.github/workflows/docker-build-push.yml@master
    secrets: inherit
    with:
      image-tag: ghcr.io/wwwallet/wallet-backend-server:latest
      docker-push: false
      dockerfile-path: ./Dockerfile
