name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches-ignore:
      - 'tmp**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every master run finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build and run tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests.Dockerfile
          push: false
